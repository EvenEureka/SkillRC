name: gate
on: [push, pull_request]
jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install -e ".[dev,harness]"
      - run: python -m pytest tests/gate tests/test_runner_gate.py tests/test_runner_review_r7.py tests/test_runner_review_r8.py -q
      - name: Release check on the bundled historical logs (expected exit 4 = DESCRIPTIVE)
        run: |
          set +e
          skillrc-gate report examples/webshop_bundled_release/gate.yaml --out gate_report
          code=$?
          cat gate_report/summary.md >> "$GITHUB_STEP_SUMMARY"
          test "$code" -eq 4
      - uses: actions/upload-artifact@v4
        with: {name: gate-report, path: gate_report}
