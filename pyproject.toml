[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrc"
version = "1.1.0"
description = "SkillRC harness and skillrc-gate: release verdicts for agent memory, prompt and harness changes from episode logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Yiwen Lu" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
harness = ["openai>=1.40", "tiktoken>=0.7", "rank-bm25==0.2.2", "requests>=2.31"]
inspect = ["inspect-ai>=0.3.150"]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
skillrc-gate = "skillrc.gate.cli:main"

[tool.setuptools.packages.find]
include = ["skillrc*"]

[tool.setuptools.package-data]
"skillrc.gate.report" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
